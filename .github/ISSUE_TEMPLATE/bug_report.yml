name: Bug report
description: Report a reproducible problem with the pipeline.
body:
  - type: textarea
    attributes:
      label: What happened?
      description: Include expected behavior and the exact command.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Environment and reproduction
      description: Python version, OS, package versions, config, and a minimal example. Do not upload dataset images without permission.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Logs
      render: shell
